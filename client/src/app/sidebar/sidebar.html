<aside class="sidebar-wrapper">
  <!-- Brand Header -->
  <div class="sidebar-brand">
    <div class="brand-icon">🏆</div>
    <div class="brand-text">
      <h3>Sports Portal</h3>
      <span>{{ userRole === 'drs' ? 'DSW / Sports Authority' : 'Dean / Verification Panel' }}</span>
    </div>
  </div>

  <!-- Navigation Menu Links -->
  <nav class="sidebar-nav">
    
    <!-- Yeh sirf tab dikhega jab user role DRS NAHI hai (Dean / College User) -->
    <ng-container *ngIf="userRole !== 'drs'">
      <a routerLink="/registration" routerLinkActive="active" class="nav-link">
        <span class="icon">✏️</span>
        <span class="title">Event Registration</span>
      </a>

      <a routerLink="/registrationList" routerLinkActive="active" class="nav-link">
        <span class="icon">📋</span>
        <span class="title">Registered Students</span>
      </a>

      <a routerLink="/groupEventUpdate" routerLinkActive="active" class="nav-link">
        <span class="icon">📋</span>
        <span class="title">Group Event Update</span>
      </a>
    </ng-container>

    <!-- Yeh sirf tab dikhega jab user role DRS HOGA -->
    <ng-container *ngIf="userRole === 'drs'">
      <a routerLink="/drs/registrationList" routerLinkActive="active" class="nav-link">
        <span class="icon">📋</span>
        <span class="title">Registered Students List</span>
      </a>

      <!-- 🏅 Naya Add Sport Button (DRS only) -->
      <a routerLink="/add-sport" routerLinkActive="active" class="nav-link">
        <span class="icon">🏅</span>
        <span class="title">Add New Sport</span>
      </a>
    </ng-container>

  </nav>

  <!-- Bottom Logout Button -->
  <div class="sidebar-footer">
    <button type="button" class="btn-sidebar-logout" (click)="onLogout()">
      <span class="logout-icon">↩</span>
      <span>Logout</span>
    </button>
  </div>
</aside>

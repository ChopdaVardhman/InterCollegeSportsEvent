# Sports event registration at http://igkv.ac.in/imis/sports
# Copy the production build (dist/SportsEvent/browser) to the alias path.
# Dean login stays on /api/DSSNew and is not proxied here.

location = /imis/sports {
    return 301 /imis/sports/;
}

location /imis/sports/ {
    alias /opt/IGKV/SportsEvent/browser/;
    index index.html;
    try_files $uri $uri/ /imis/sports/index.html;
}

location = /imis/sports/api/health {
    proxy_pass http://10.132.34.73:3510/api/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /imis/sports/api/health/live {
    proxy_pass http://10.132.34.73:3510/api/health/live;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /imis/sports/api/ {
    proxy_pass http://10.132.34.73:3510/api/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
    client_max_body_size 20m;
}
